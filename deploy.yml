name: Deploy to AWS

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the 'main' branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest  # Use the latest Ubuntu image in GitHub Actions

    steps:
      # Step 1: Checkout code from GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v3  # GitHub Action to pull your code

      # Step 2: Log in to AWS ECR (Elastic Container Registry)
      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin <your_ecr_uri>
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}  # Use GitHub Secrets for AWS credentials
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Step 3: Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t ml-api .  # Build the Docker image with the 'ml-api' tag
          docker tag ml-api:latest <your_ecr_uri>/ml-api:latest  # Tag the image with the ECR repository URI
          docker push <your_ecr_uri>/ml-api:latest  # Push the image to ECR
